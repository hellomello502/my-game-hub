<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Game Hub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
    }
    header {
      background: #1f1f1f;
      padding: 1em 2em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5em;
      font-weight: bold;
    }
    .add-game-btn {
      background: #00b894;
      color: white;
      padding: 0.5em 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    main {
      padding: 2em;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5em;
    }
    .game-card {
      background: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .game-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .game-card .content {
      padding: 1em;
    }
    .game-card .content h3 {
      margin-top: 0;
    }
    .game-card .content a {
      color: #00cec9;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">My Game Hub</div>
    <button class="add-game-btn" onclick="addGame()">+ Add Game</button>
  </header>
  <main id="gameContainer">
    <!-- Game cards will appear here -->
  </main>

  <script>
    function addGame() {
      const title = prompt("Enter game title:");
      const imageUrl = prompt("Enter image URL:");
      const link = prompt("Enter game link (play/download):");
      if (title && imageUrl && link) {
        const container = document.getElementById("gameContainer");
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
          <img src="${imageUrl}" alt="${title}" />
          <div class="content">
            <h3>${title}</h3>
            <a href="${link}" target="_blank">Play / Download</a>
          </div>
        `;
        container.appendChild(card);
      }
    }
  </script>
</body>
</html>
